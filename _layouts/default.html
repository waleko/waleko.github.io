<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.name }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="{{ site.name }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | replace: '.html', '' | absolute_url }}">
<link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cormorant-garamond-600-latin.woff2" as="font" type="font/woff2" crossorigin>
{% if page.preload_image %}<link rel="preload" href="{{ page.preload_image }}" as="image" type="image/webp">
{% endif %}<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<main>
  <nav id="nav" aria-label="Site">
    <a href="/"{% if page.url == '/' %} aria-current="page"{% endif %}>home</a>
    <a href="/research"{% if page.url contains '/research' %} aria-current="page"{% endif %}>research</a>
    <a href="{{ site.cv }}">cv</a>
  </nav>

{{ content }}
  <footer>
    <nav aria-label="Elsewhere">
      <a href="mailto:{{ site.email }}">email</a><span aria-hidden="true">/</span>
      <a href="{{ site.scholar }}">scholar</a><span aria-hidden="true">/</span>
      <a href="https://www.linkedin.com/in/{{ site.linkedin }}">linkedin</a><span aria-hidden="true">/</span>
      <a href="https://github.com/{{ site.github_username }}">github</a>
    </nav>
  </footer>
</main>
{% if page.script %}<script src="{{ page.script }}" defer></script>
{% endif %}</body>
</html>
